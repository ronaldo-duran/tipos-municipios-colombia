[project]
name = "tipologia-municipios"
version = "0.1.0"
description = "Tipología de los municipios de Colombia mediante clustering sobre indicadores socioeconómicos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "openpyxl>=3.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "umap-learn>=0.5.6",
    "geopandas>=1.0",
    "pyogrio>=0.7",
    "shapely>=2.0",
    "libpysal>=4.10",
    "esda>=2.5",
    "plotly>=5.20",
    "streamlit>=1.35",
    "truststore>=0.10.4",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
tipologia = "tipologia.pipeline.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tipologia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
